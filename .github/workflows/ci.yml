name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The cosmos-predict2.5 SOURCE tree IS initialised on CI (it is a
          # public submodule: ~150 MB shallow pack + ~140 MB working tree, of
          # which 117 MB is assets/ — small enough for a runner). Without it
          # ~110 tests — the entire model / train / distill / served-policy
          # path — skipped, so a dependency bump could break the model and
          # still show a green tick.
          # `fetch-depth` defaults to 1, which makes actions/checkout clone the
          # submodule with --depth=1 too.
          # Still ABSENT: the ~4.8 GB Cosmos-Predict2.5-2B WEIGHTS (gitignored,
          # undownloadable here). Tests needing them carry
          # `requires_cosmos_weights` and keep skipping — see tests/conftest.py.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the rig venv's interpreter (dmrobotics needs 3.8-3.11)
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only wheels: the default PyPI wheel drags in the whole CUDA stack
      # (~2.5 GB) which this runner has no GPU for. Deliberately UNPINNED —
      # this job is the early-warning system for the next torch release
      # (requirements/*.txt pin the exact GPU pair the boxes run).
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      # `[train]` + `[cosmos]` are the import-time deps of phantom.train /
      # phantom.backbone; scipy comes from `[sim]`. Deliberately NOT installed:
      # `[hw]` (no rig), rerun (`[viz]`), opencv and matplotlib — tests needing
      # OpenCV carry the `requires_cv2` marker and skip.
      - name: Install phantom
        run: pip install -e ".[dev,train,cosmos]" scipy

      # Fail LOUDLY if the submodule did not land: without this the cosmos
      # tests would merely skip and the job would still be green.
      - name: Assert the cosmos source tree is importable
        run: |
          python - <<'PY'
          from phantom.backbone import loader as bl
          from phantom.config.paths import load_paths
          bl.setup_cosmos(load_paths())
          import cosmos_predict2
          print("cosmos_predict2 from", cosmos_predict2.__file__)
          PY

      # `python -m pytest` (not bare `pytest`): the tests import `tools.sim.*`,
      # which only resolves with the repo root on sys.path.
      # `-m "not slow"` drops the multi-minute spawned-rank tests, which cannot
      # beat the 300 s pytest-timeout on a 2-core runner; they still run locally.
      - name: Run tests
        run: python -m pytest -q -rs -m "not slow"

  # The model itself: does it still BUILD and RUN end to end after a dependency
  # bump? Tiny configs, CPU, no weights — ~1 min of compute. A separate job so
  # the answer is a named tick, not something buried in 2500 test results.
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true        # same reasoning as the `pytest` job above

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install phantom
        run: pip install -e ".[dev,train,cosmos]" scipy

      - name: Assert the cosmos source tree is importable
        run: |
          python - <<'PY'
          import torch
          from phantom.backbone import loader as bl
          from phantom.config.paths import load_paths
          bl.setup_cosmos(load_paths())
          import cosmos_predict2, phantom
          print("torch", torch.__version__, "| cosmos_predict2", cosmos_predict2.__file__)
          PY

      # build -> forward -> one training step of EVERY program's loss -> NFE
      # sample -> pack/unpack round trip -> checkpoint round trip (~5 s).
      - name: Tiny model smoke (build -> losses -> sample -> checkpoint)
        run: python -m phantom.scripts.smoke_test --tiny --synthetic --device cpu

      # The same path through the real CLIs and the deploy runtime:
      # train_teacher.main -> checkpoint -> distill_hid.main -> --resume,
      # a real tiny policy served over the localhost protocol, and a full mock
      # deploy episode. See the `model_smoke` marker in tests/conftest.py.
      - name: Marked model-smoke tests (train / distill / serve / deploy)
        run: python -m pytest -q -rs -m "model_smoke and not slow"
