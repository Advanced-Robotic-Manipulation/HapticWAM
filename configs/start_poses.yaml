# Regenerate with tools/gen_start_poses.py after any dataset change.
# tcp: [x, y, z, rx, ry, rz]  (m / axis-angle rad, UR base frame)
# Used by run_deploy (homing is default-on for a real arm; --no-home skips,
# --max-start-sigma gates episode start, --allow-ood-start overrides).
# 2026-08-26: includes batch_20260822 — the Aug-22 rig geometry sits ~0.77 sigma
# from the Aug-01..04 sessions in ur_state; means moved <= 11 mm, stds tightened.
# 2026-08-28: q_mean/q_std (start joint vector, rad) + tcp_z_min (lowest demo TCP z, m)
# + tcp_min/tcp_max (demo TCP envelope over ALL frames -> run_deploy STOP hitbox)
# added from the compute3 subset (val_eval + batch_20260822 successes, n=q_n per task);
# the policy reads RAW joints, so a wrapped wrist / flipped IK branch gates OUT even
# when the TCP pose is fine (16/26 rig episodes ran like that on 08-28). Regenerate
# both over the full dataset with tools/gen_start_poses.py when it is on one box.
