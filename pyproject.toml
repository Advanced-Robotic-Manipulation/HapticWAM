[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-robot"
version = "0.1.0"
description = "HapticWAM: a haptic world-action model — tactile-conditioned Cosmos teacher distilled into a pad-free student (ICRA 2027)"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "zarr>=2.16,<3",
    "numcodecs<0.16",
    "einops>=0.7",
    "pillow>=10",     # scene/camera JPEG storage codec (cv2 is the rig fast path)
]

[project.optional-dependencies]
sim = [
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]
# Model/training stack (needs a CUDA box for real runs; CPU ok for tiny smoke tests)
train = [
    "torch>=2.7",
    "peft>=0.11",
    "safetensors",
    "tensorboard",
]
# Import-time deps of the cosmos-predict2.5 submodule (imported as a library;
# CUDA-only packages like transformer-engine are shimmed by backbone/compat.py)
cosmos = [
    "loguru",
    "omegaconf",
    "attrs",
    "iopath",
    "nvidia-ml-py",
    "boto3",
    "imageio",
    "pandas",
    "torchvision",
]
# Real hardware drivers (recording rig / deployment box only)
hw = [
    "ur-rtde>=1.5",
    "pyrealsense2",
    "pyspacemouse",
    "pyserial>=3.5",     # Echo exoskeleton leader (teleop/echo.py)
    "opencv-python",
]
# Live visualization: rerun.io stream + the web control panel's embedded view
viz = [
    "rerun-sdk>=0.20",
]
dev = [
    "pytest>=8",
    "pytest-timeout",
]

[tool.setuptools.packages.find]
include = ["phantom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
